<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex justify-center items-center">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96 animate-fade-in-down">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center mx-auto mb-2 text-2xl">
                <i class="fa-solid fa-cube"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Bienvenido</h1>
            <p class="text-gray-500 text-sm">Ingresa tus credenciales</p>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                    Correo Electrónico
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input 
                        class="pl-10 shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" 
                        id="email" 
                        type="email" 
                        placeholder="admin@empresa.com"
                        required>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                    Contraseña
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input 
                        class="pl-10 shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" 
                        id="password" 
                        type="password" 
                        placeholder="******************"
                        required>
                </div>
            </div>

            <div id="errorMsg" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded relative mb-4 text-xs font-bold text-center">
            </div>

            <div class="flex items-center justify-between">
                <button 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition transform hover:scale-105" 
                    type="submit">
                    Ingresar
                </button>
            </div>
        </form>
        
        <p class="text-center text-gray-400 text-xs mt-6">
            &copy; 2026 Sistema de Inventario V1.0
        </p>
    </div>

    <!-- 🔥 NUEVO: VENTANA FLOTANTE URBANA PARA SELECCIONAR SUCURSAL (MODAL) -->
    <div id="modalTiendas" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
        <div class="bg-neutral-900 border-4 border-white p-6 max-w-lg w-full shadow-[10px_10px_0px_rgba(255,255,255,1)] text-center">
            <h2 class="text-white text-2xl font-black tracking-widest uppercase mb-1">SELECCIONAR SUCURSAL</h2>
            <p class="text-neutral-400 text-[10px] uppercase tracking-widest mb-6">Elige el entorno de trabajo activo</p>
            
            <!-- Contenedor donde se pintarán tus sucursales reales en dos columnas -->
            <div id="contenedorTiendas" class="grid grid-cols-2 gap-4 max-h-80 overflow-y-auto pr-1">
                <!-- Inyectado dinámicamente por JavaScript -->
            </div>
        </div>
    </div>

<script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value; 
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = e.target.querySelector('button');

            const textoOriginal = btn.innerText;
            btn.innerText = 'Cargando...';
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json(); 

                if (res.ok) {
                    // ¿El backend dice que somos un usuario maestro y pide elegir tienda?
                    if (data.seleccionar_tienda) {
                        // Guardamos el token provisional de 15 min
                        localStorage.setItem('token', data.token);
                        
                        // Mostramos el modal y le mandamos las tiendas que vinieron del servidor
                        abrirSelectorTiendas(data.tiendas);
                        return;
                    }

                    // Flujo normal para empleados estándar (Vendedores, etc.)
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.user));
                    window.location.href = '/index.html';

                } else {
                    errorMsg.innerText = data.error || 'Credenciales inválidas';
                    errorMsg.classList.remove('hidden');
                    
                    btn.innerText = textoOriginal;
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            } catch (error) {
                console.error(error);
                errorMsg.innerText = 'Error de conexión con el servidor';
                errorMsg.classList.remove('hidden');
                
                btn.innerText = textoOriginal;
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        // Genera y despliega las sucursales en pantalla
        function abrirSelectorTiendas(tiendas) {
            const modal = document.getElementById('modalTiendas');
            const contenedor = document.getElementById('contenedorTiendas');
            
            contenedor.innerHTML = ''; 

            tiendas.forEach(tienda => {
                const tarjeta = document.createElement('button');
                tarjeta.className = "bg-neutral-800 text-white border-2 border-neutral-700 p-4 font-bold text-xs uppercase tracking-wider hover:border-white hover:bg-neutral-700 transition text-center flex flex-col items-center justify-center gap-1";
                
                tarjeta.innerHTML = `
                    <span class="text-sm font-black tracking-wide">${tienda.nombre}</span>
                    <span class="text-[9px] text-neutral-500">ID: 00${tienda.id}</span>
                `;

                // Acción al cliquear una tienda en el modal
                tarjeta.onclick = async () => {
                    try {
                        const tokenProvisional = localStorage.getItem('token');

                        // Enviamos la sucursal seleccionada al nuevo endpoint que creamos
                        const resFinal = await fetch('/api/auth/establecer-tienda', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${tokenProvisional}`
                            },
                            body: JSON.stringify({ tienda_id: tienda.id })
                        });

                        const dataFinal = await resFinal.json();

                        if (!resFinal.ok) throw new Error(dataFinal.error);

                        // GUARDADO FINAL: Guardamos el token definitivo y el objeto completo del usuario
                        localStorage.setItem('token', dataFinal.token);
                        localStorage.setItem('usuario', JSON.stringify(dataFinal.user));
                        
                        // Redirigimos al sistema principal
                        window.location.href = '/index.html';

                    } catch (err) {
                        alert("Error estableciendo sucursal: " + err.message);
                    }
                };

                contenedor.appendChild(tarjeta);
            });

            // Quitamos la clase 'hidden' para renderizar el modal en pantalla
            modal.classList.remove('hidden');
        }
    </script>

    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/ajustes/mensaje-pago'); 
                const data = await res.json();
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
