<div class="space-y-8 animate-fade-in pb-8">

    <!-- ENCABEZADO PRINCIPAL CON CONTROLES MULTI-TIENDA -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 bg-white p-8 border border-neutral-300 rounded-none">
        <div>
            <h2 class="text-3xl md:text-4xl font-black text-neutral-950 tracking-tighter uppercase flex items-center">
                <i class="fa-solid fa-clipboard-check mr-4 text-neutral-400"></i>
                Control y Auditoría
            </h2>
            <p class="text-[10px] text-neutral-500 font-bold uppercase tracking-widest mt-2">Monitoreo de caducidad y registro de seguridad corporativo</p>
        </div>
        
        <!-- PANEL DE ACCIONES ADMINISTRATIVAS -->
        <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto items-center">
            
            <!-- Selector dinámico de Sucursales (Visible solo para Dev/Admin) -->
            <div id="containerSelectorTiendaAuditoria" class="hidden w-full sm:w-64 relative group">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 text-xs"><i class="fa-solid fa-store"></i></span>
                <select id="selectorTiendaAuditoria" onchange="window.cambiarSucursalAuditoriaUI()" class="w-full pl-10 pr-4 py-4 bg-neutral-50 border border-neutral-300 text-xs font-black uppercase tracking-widest text-neutral-950 outline-none focus:bg-white focus:border-neutral-950 focus:ring-1 focus:ring-neutral-950 cursor-pointer rounded-none appearance-none"></select>
                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-neutral-400 pointer-events-none text-[10px]">▼</span>
            </div>

            <!-- Buscador Avanzado de Logs -->
            <div class="relative w-full sm:w-72 group">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 text-xs"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="buscadorLogsAuditoria" oninput="window.filtrarLogsTerminal(this.value)" placeholder="FILTRAR LOGS (EJ: ELIMINAR)..." class="w-full pl-10 pr-4 py-4 bg-neutral-50 border border-neutral-300 text-xs font-black uppercase tracking-widest text-neutral-950 outline-none focus:bg-white focus:border-neutral-950 focus:ring-1 focus:ring-neutral-950 rounded-none placeholder-neutral-400">
            </div>
        </div>
    </div>

    <!-- CUERPO DE PANTALLA: CONTENEDORES ASILADOS -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- SECCIÓN IZQUIERDA: CADUCIDAD DE LOTES -->
        <div class="lg:col-span-7 flex flex-col h-full bg-white border border-neutral-300 rounded-none shadow-none border-t-4 border-t-neutral-950">
            <div class="p-6 bg-white border-b border-neutral-200 flex justify-between items-center shrink-0">
                <h3 class="font-black text-sm uppercase tracking-widest text-neutral-950 flex items-center gap-3">
                    <i class="fa-solid fa-hourglass-half text-neutral-400"></i> Control de Caducidad
                </h3>
                
                <!-- Selector rápido de criticidad de lotes -->
                <select id="filtroSemaforoLotes" onchange="window.recargarFiltroLotesUI()" class="bg-neutral-50 border border-neutral-300 p-2 font-black text-[9px] uppercase tracking-widest outline-none focus:border-neutral-950 cursor-pointer rounded-none">
                    <option value="TODOS">Todos los lotes</option>
                    <option value="CRITICOS">Críticos y Vencidos</option>
                </select>
            </div>
            
            <div class="overflow-x-auto flex-1 bg-neutral-50 max-h-[600px] overflow-y-auto custom-scrollbar">
                <table class="min-w-full text-sm text-left border-collapse">
                    <thead class="bg-neutral-100 text-[10px] uppercase font-black text-neutral-950 tracking-widest border-b border-neutral-300 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="px-6 py-5">Producto</th>
                            <th class="px-6 py-5 text-center">Identificador (Lote)</th>
                            <th class="px-6 py-5 text-center">Vencimiento</th>
                            <th class="px-6 py-5 text-center">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaVencimientos" class="divide-y divide-neutral-200 bg-white font-medium text-neutral-800">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SECCIÓN DERECHA: TERMINAL LINUX DE LOGS -->
        <div class="lg:col-span-5 flex flex-col h-full min-h-[500px] max-h-[650px] bg-neutral-950 border border-neutral-800 rounded-none shadow-none">
            
            <div class="p-6 border-b border-neutral-800 flex justify-between items-center bg-black shrink-0">
                <h3 class="font-black text-white text-sm uppercase tracking-widest flex items-center gap-3">
                    <i class="fa-solid fa-terminal text-neutral-500 font-mono"></i> Monitor de Seguridad
                </h3>
                <div class="flex gap-4 items-center">
                    <select id="filtroTipoLog" onchange="window.cargarAuditoria()" class="bg-neutral-900 text-neutral-400 border border-neutral-800 p-1.5 font-bold text-[9px] uppercase tracking-widest outline-none focus:border-neutral-500 cursor-pointer rounded-none">
                        <option value="TODOS">Todos los logs</option>
                        <option value="seguridad">Seguridad y Destrucción</option>
                    </select>
                    <button onclick="cargarAuditoria()" class="text-neutral-500 hover:text-white transition-colors" title="Actualizar Logs">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>
            
            <div id="listaLogs" class="flex-1 overflow-y-auto p-6 space-y-4 font-mono text-[10px] uppercase tracking-widest text-neutral-400 bg-neutral-950 custom-scrollbar">
                <div class="text-neutral-600 text-center mt-16 font-bold flex flex-col items-center gap-4">
                    <i class="fa-solid fa-terminal text-4xl opacity-50"></i>
                    Recuperando registros del sistema...
                </div>
            </div>
        </div>
    </div>
</div>
